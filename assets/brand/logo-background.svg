<!-- OfisNow adaptive icon arka plan katmanı (glyph'siz gradyan). android-icon-background.png buradan üretilir. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#BFD8C9"/>
      <stop offset="0.5" stop-color="#7FA98F"/>
      <stop offset="1" stop-color="#3E6350"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
</svg>
